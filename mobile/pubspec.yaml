name: smart_flight_deck
description: Professional EFB + Voice Assistant for MSFS

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Audio Recording & Playback
  record: ^5.0.4
  audioplayers: ^5.2.1

  # QR Code
  mobile_scanner: ^3.5.5

  # Map (MVP Sonrasi)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Permissions
  permission_handler: ^11.1.0

  # Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0

  # Utils
  path_provider: ^2.1.1
  uuid: ^4.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  # Assets will be added as needed
  # assets:
  #   - assets/icons/
  #   - assets/sounds/
  #   - assets/data/

  # Using Google Fonts for JetBrainsMono instead of local fonts
  # fonts:
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  #       - asset: assets/fonts/JetBrainsMono-Bold.ttf
  #         weight: 700
